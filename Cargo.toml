[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/web", "crates/portal"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unused_qualifications = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
# Internal crates; the dependency direction is core <- store <- web <- portal.
portal-core = { path = "crates/core" }
portal-store = { path = "crates/store" }
portal-web = { path = "crates/web" }

# Checked against crates.io on 2026-11-06: the newest compatible stable
# releases that are at least 14 days old (README, "Dependencies").
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "getrandom", "password-hash"] }
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "query", "tokio"] }
blake2 = { version = "0.11.0", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
# `raw_value` keeps each CFM profile as the exact text Mooring wrote.
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_urlencoded = "0.7.1"
subtle = { version = "2.6.1", default-features = false, features = ["std"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

# Tests only.
tempfile = "3.27.0"
tower = { version = "0.5.3", default-features = false, features = ["util"] }

# Argon2 is very slow unoptimised; tests use cheap parameters, but the dev
# server hashes with the production ones.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
